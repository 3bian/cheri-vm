<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I2C temperature sensor</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/room.css" />
  </head>
  <body>
    <div id="status">Connecting</div>
    <output id="reading"></output>
    <input id="temperature" type="range" min="-40" max="125" step="0.0625" value="25" />
    <div id="count">No transactions yet</div>
    <script src="js/room.js"></script>
    <script>
      "use strict";

      const name = parameter("device", "i2c/0x48");
      const slider = document.getElementById("temperature");
      const reading = document.getElementById("reading");
      const count = document.getElementById("count");
      let transactions = 0;

      function register() {
        const steps = Math.round(Number(slider.value) / 0.0625) << 4;
        return [(steps >> 8) & 0xff, steps & 0xff];
      }

      function show() {
        const [high, low] = register();
        const hex = (byte) => byte.toString(16).padStart(2, "0");
        reading.textContent = `${Number(slider.value).toFixed(4)} °C = 0x${hex(high)}${hex(low)}`;
      }

      const send = device(name, (message) => {
        if (message.type !== "i2c") {
          return;
        }
        const bytes = new Uint8Array(message.read);
        bytes.set(register().slice(0, message.read));
        send({ type: "reply", id: message.id, data: encode(bytes) });
        transactions += 1;
        count.textContent = `${transactions} transactions answered`;
      });
      slider.addEventListener("input", show);
      show();
    </script>
  </body>
</html>
